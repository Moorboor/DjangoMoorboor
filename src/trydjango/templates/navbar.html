<style>
  /* ── Reset ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; }
  nav, nav ul { margin: 0; padding: 0; }

  /* ── Fixed bar ─────────────────────────────────────────────── */
  nav {
    position:   fixed;           /* ✅ stays at top while scrolling */
    top:        0;
    left:       0;
    width:      100%;
    z-index:    1000;
    background: #111;
    padding:    .5rem 1.5rem;
    display:    flex;
    align-items:     center;
    justify-content: space-between;
  }

  /* ── Logo / site name (optional) ───────────────────────────── */
  .nav-logo {
    color:           #fff;
    font-family:     "Helvetica Neue", Arial, sans-serif;
    font-size:       1.1rem;
    font-weight:     bold;
    text-decoration: none;
    white-space:     nowrap;
  }

  /* ── Link list ─────────────────────────────────────────────── */
  nav ul {
    display:     flex;
    gap:         .25rem;
    list-style:  none;
    align-items: center;
  }

  nav a {
    display:         block;
    padding:         .4rem .75rem;
    color:           #ccc;
    text-decoration: none;
    font-family:     "Helvetica Neue", Arial, sans-serif;
    font-size:       .95rem;
    border-radius:   4px;
    transition:      color .2s, background .2s;
    white-space:     nowrap;
  }

  nav a:hover,
  nav a:focus {
    color:      #fff;
    background: rgba(255,255,255,.15);
    outline:    none;
  }

  /* ── Active page ────────────────────────────────────────────── */
  nav a.active {
    color:      #fff;
    font-weight: bold;
    background: rgba(255,255,255,.1);
    border-bottom: 2px solid #fff;
  }

  /* ── Hamburger button (mobile only) ────────────────────────── */
  .nav-toggle {
    display:    none;         /* hidden on desktop */
    background: none;
    border:     none;
    cursor:     pointer;
    padding:    .4rem;
    gap:        5px;
    flex-direction: column;
    justify-content: center;
  }

  .nav-toggle span {
    display:      block;
    width:        24px;
    height:       2px;
    background:   #fff;
    border-radius: 2px;
    transition:   transform .3s, opacity .3s;
  }

  /* Animate hamburger → X when open */
  .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2) { opacity: 0; }
  .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* ── Mobile layout ──────────────────────────────────────────── */
  @media (max-width: 700px) {
    .nav-toggle { display: flex; }  /* show hamburger */

    nav ul {
      display:        none;         /* hidden until toggled */
      position:       absolute;
      top:            100%;
      left:           0;
      width:          100%;
      flex-direction: column;
      background:     #111;
      padding:        .5rem 0 1rem;
      gap:            0;
      border-top:     1px solid #333;
    }

    nav ul.open { display: flex; }  /* shown when toggled */

    nav a {
      padding:     .75rem 1.5rem;
      font-size:   1rem;
      border-radius: 0;
    }
  }

  /* ── Push page content below fixed nav ─────────────────────── */
  body { padding-top: 48px; }
</style>

<nav id="main-nav">
  <a class="nav-logo" href="{% url 'gallery' %}">Artworks</a>  {# ← change or remove #}

  <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <ul id="nav-links">
    <li><a href="{% url 'home' %}">Home</a></li>
    <li><a href="{% url 'gallery' %}">Gallery</a></li>
    <li><a href="{% url 'map' %}">Map</a></li>
    <li><a href="{% url 'threeTest' %}">Three Test</a></li>
    <li><a href="{% url 'contacts' %}">Contacts</a></li>
    <li><a href="{% url 'museum' %}">Museum</a></li>
    <li><a href="{% url 'philosophy' %}">Philosophy</a></li>
  </ul>
</nav>

<script>
  // ── Hamburger toggle ────────────────────────────────────────
  const toggle   = document.getElementById("nav-toggle");
  const navLinks = document.getElementById("nav-links");

  toggle.addEventListener("click", () => {
    const open = navLinks.classList.toggle("open");
    toggle.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", open);
  });

  // Close menu when a link is clicked (mobile)
  navLinks.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", () => {
      navLinks.classList.remove("open");
      toggle.classList.remove("open");
      toggle.setAttribute("aria-expanded", false);
    });
  });

  // ── Auto-highlight active page ──────────────────────────────
  const current = window.location.pathname;
  navLinks.querySelectorAll("a").forEach(a => {
    if (a.getAttribute("href") === current) a.classList.add("active");
  });

  // ── Counter-transform during page swipe ─────────────────────
  // Keeps nav fixed in place while body slides
  const nav = document.getElementById("main-nav");

  window.addEventListener("navdrag", e => {          // fired by swipe script
    nav.style.transition = "none";
    nav.style.transform  = `translateX(${-e.detail.dx}px)`;
  });
  window.addEventListener("navsnap", () => {         // fired on release
    nav.style.transition = "transform 0.3s ease";
    nav.style.transform  = "translateX(0)";
  });
</script>
