<style>
  /* ── NAVBAR VARIABLES & SYSTEM RESET ── */
  :root {
    --nav-height: 60px;
    --nav-bg: rgba(10, 10, 10, 0.95);
    --mobile-overlay-bg: rgba(8, 8, 8, 0.98);
    --border-color: rgba(255, 255, 255, 0.08);
    --text-muted: rgba(255, 255, 255, 0.6);
  }

  *, *::before, *::after { box-sizing: border-box; }
  nav, nav ul { margin: 0; padding: 0; }

  /* Ensure page content is neatly offset under the fixed navbar */
  body { 
    padding-top: var(--nav-height) !important; 
  }

  /* ── FIXED MAIN BAR (MOBILE-FIRST) ── */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--nav-height);
    z-index: 1000;
    background: var(--nav-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
  }

  .nav-logo {
    color: #ffffff;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 1002; /* Keep above overlay when open */
  }

  /* ── HAMBURGER BUTTON (VISIBLE ON MOBILE BY DEFAULT) ── */
  .nav-toggle {
    display: flex;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.5rem;
    gap: 6px;
    flex-direction: column;
    justify-content: center;
    z-index: 1002; /* Keep above overlay when open */
  }

  .nav-toggle span {
    display: block;
    width: 22px;
    height: 2px;
    background: #ffffff;
    border-radius: 2px;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
  }

  /* Morph hamburger lines into "X" when open */
  .nav-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2) { opacity: 0; }
  .nav-toggle.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* ── MOBILE MENU OVERLAY (DEFAULT MOBILE VIEW) ── */
  nav ul {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh; /* Fallback */
    height: 100dvh; /* Avoid issues with mobile browser address bars */
    background: var(--mobile-overlay-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 1.75rem;
    list-style: none;
    
    /* Elegant slide-down transition */
    transform: translateY(-100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 1001;
    padding: 2rem;
  }

  nav ul.open {
    transform: translateY(0);
  }

  nav ul li {
    width: 100%;
    max-width: 280px;
    text-align: center;
  }

  /* Spacious, easily tap-able targets for touch screens */
  nav a {
    display: block;
    padding: 0.8rem 1.5rem;
    color: var(--text-muted);
    text-decoration: none;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 1.3rem;
    font-weight: 300;
    letter-spacing: 1px;
    border-radius: 8px;
    transition: color 0.2s, background-color 0.2s;
  }

  /* Tactile visual response on touch */
  nav a:active {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.08);
  }

  /* Active class styling (Mobile) */
  nav a.active {
    color: #ffffff;
    font-weight: 600;
    border-bottom: 2px solid #ffffff;
    display: inline-block;
    border-radius: 0;
  }

  /* ── DESKTOP SCALE-UP ENHANCEMENTS (WIDTHS > 768px) ── */
  @media (min-width: 768px) {
    .nav-toggle {
      display: none; /* Hide mobile menu hamburger */
    }

    nav {
      padding: 0 2rem;
    }

    /* Convert overlay back to simple inline horizontal navbar */
    nav ul {
      position: static;
      width: auto;
      height: auto;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      flex-direction: row;
      gap: 0.25rem;
      transform: none !important; /* Cancel mobile slide positioning */
      padding: 0;
      transition: none;
    }

    nav ul li {
      width: auto;
    }

    nav a {
      font-size: 0.95rem;
      padding: 0.4rem 0.75rem;
      color: #ccc;
      border-radius: 4px;
    }

    nav a.active {
      background: rgba(255, 255, 255, 0.1);
      border-bottom: 2px solid #ffffff;
      display: block;
    }

    /* Standard desktop hover states */
    @media (hover: hover) {
      nav a:hover,
      nav a:focus {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.15);
        outline: none;
      }
    }
  }
</style>

<nav id="main-nav">
  <a class="nav-logo" href="{% url 'gallery' %}">Artworks</a>

  <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <ul id="nav-links">
    <li><a href="{% url 'home' %}">Home</a></li>
    <li><a href="{% url 'gallery' %}">Gallery</a></li>
    <li><a href="{% url 'map' %}">Map</a></li>
    <li><a href="{% url 'threeTest' %}">Three Test</a></li>
    <li><a href="{% url 'contacts' %}">Contacts</a></li>
    <li><a href="{% url 'museum' %}">Museum</a></li>
    <li><a href="{% url 'university' %}">University work</a></li>
  </ul>
</nav>

<script>
  // ── Hamburger toggle ────────────────────────────────────────
  const toggle   = document.getElementById("nav-toggle");
  const navLinks = document.getElementById("nav-links");

  toggle.addEventListener("click", () => {
    const open = navLinks.classList.toggle("open");
    toggle.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", open);
  });

  // Close menu when a link is clicked (mobile navigation)
  navLinks.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", () => {
      navLinks.classList.remove("open");
      toggle.classList.remove("open");
      toggle.setAttribute("aria-expanded", false);
    });
  });

  // ── Auto-highlight active page ──────────────────────────────
  const current = window.location.pathname;
  navLinks.querySelectorAll("a").forEach(a => {
    if (a.getAttribute("href") === current) a.classList.add("active");
  });

  // ── Counter-transform during page swipe ─────────────────────
  // Keeps nav fixed in place while body slides
  const nav = document.getElementById("main-nav");

  window.addEventListener("navdrag", e => {          // fired by swipe script
    nav.style.transition = "none";
    nav.style.transform  = `translateX(${-e.detail.dx}px)`;
  });
  window.addEventListener("navsnap", () => {         // fired on release
    nav.style.transition = "transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)";
    nav.style.transform  = "translateX(0)";
  });
</script>
